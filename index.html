<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Cloud Vape</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#fff;--muted:rgba(225,236,255,.62);--glass1:rgba(255,255,255,.13);--glass2:rgba(255,255,255,.04);--border:rgba(255,255,255,.17);--hl:rgba(255,255,255,.24);--shadow:0 12px 32px rgba(0,0,0,.35);--input:rgba(255,255,255,.06);--bg:#030817;--acc:#6db3ff;--ok:#3ddc97;--bad:#ff6b8f;--warn:#ffb020}
body.light{--text:#0b1736;--muted:rgba(11,23,54,.56);--glass1:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.48);--border:rgba(255,255,255,.95);--hl:#fff;--shadow:0 10px 28px rgba(30,70,150,.14);--input:rgba(255,255,255,.65);--bg:#eef4ff;--acc:#1d5fd6;--ok:#14a86a;--bad:#d6335b;--warn:#c27a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--acc);text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(95% 60% at -15% 35%,#3b93ff 0%,#1554d6 24%,rgba(8,24,90,.9) 50%,transparent 76%),radial-gradient(70% 45% at 115% 105%,rgba(40,60,210,.5),transparent 70%),#030817}
body.light .bg{background:radial-gradient(95% 60% at -15% 35%,#8cbfff 0%,#c8ddfc 42%,transparent 76%),radial-gradient(70% 45% at 115% 105%,#d4dbff,transparent 70%),#eef4ff}
body.admin .bg{background:radial-gradient(95% 60% at 115% 20%,#3b6bff 0%,#1a3fc0 22%,rgba(10,20,80,.9) 48%,transparent 76%),radial-gradient(70% 45% at -15% 105%,rgba(40,60,210,.5),transparent 70%),#030817}
body.admin.light .bg{background:radial-gradient(95% 60% at 115% 20%,#a9c6ff 0%,#d6e3ff 42%,transparent 76%),#eef4ff}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(112px + env(safe-area-inset-bottom))}
.glass{background:linear-gradient(140deg,var(--glass1),var(--glass2));backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hl),inset 0 -1px 0 rgba(255,255,255,.04),var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px;gap:10px}
h1{font-size:32px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
h3{margin:0}
.sub{color:var(--muted);font-size:14px;margin-bottom:2px}
.brandline{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:4px}
.logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.ibtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn.sm{width:36px;height:36px}.ibtn.sm svg{width:18px;height:18px}
.ibtn.primary,.add,.btn.primary,.chip.on,.opt.on,.msg.me,.age-badge,.ava,.promo .pi,.logo{background:linear-gradient(180deg,#5aa8ff,#2672ea);color:#fff;border:1px solid rgba(170,215,255,.6)}
.promo{display:flex;gap:12px;align-items:center;border-radius:24px;padding:14px 16px;margin-bottom:12px}
.promo .pi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.promo b{display:block;font-size:15px}.promo span{font-size:13px;color:var(--muted)}
.srow{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-radius:26px;color:var(--muted);min-width:0}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}
.search input::placeholder{color:var(--muted)}
.fbtn{display:flex;align-items:center;gap:8px;padding:0 18px;height:52px;border-radius:26px;font-weight:700;flex:none}
.cnt{font-style:normal;background:#2f86f5;color:#fff;border-radius:10px;font-size:11px;padding:2px 7px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip,.opt{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid var(--border);background:var(--input);font-weight:600;font-size:14px}
.chip.on,.opt.on{box-shadow:0 6px 18px rgba(38,114,234,.38)}
.chip.sm{padding:7px 12px;font-size:13px}
.opt.na{opacity:.4;text-decoration:line-through}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt-title{font-weight:700;margin:16px 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:26px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pic{position:relative;aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.16),transparent 64%);overflow:hidden}
.pic svg.art{width:76%;height:76%}
.pic img,.hero img{width:100%;height:100%;object-fit:cover}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scrollbar-width:none}
.gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.tags{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:10px;color:#fff}
.tag.hit{background:rgba(255,140,40,.88)}.tag.new{background:rgba(30,185,115,.88)}.tag.sale{background:rgba(240,60,100,.88)}.tag.out{background:rgba(110,120,140,.9)}
.fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.fav svg{width:18px;height:18px}
.fav.on,.ibtn.on{color:#ff5a8a}.fav.on svg,.ibtn.on svg{fill:#ff5a8a}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.brand{font-size:12px;color:var(--muted);font-weight:600}
.pname{font-weight:700;font-size:15px;line-height:1.25}
.rate{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.rate svg{width:14px;height:14px;fill:#ffc53d;stroke:#ffc53d}
.prow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:16px}.price small{font-size:12px;font-weight:600}
.price s{display:block;font-size:12px;color:var(--muted);font-weight:500}
.add{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.add:disabled{opacity:.35}
.btn{height:54px;border-radius:27px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px}
.btn.sm{height:44px;font-size:14px;border-radius:22px;padding:0 16px}
.btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px rgba(38,114,234,.38)}
.btn.green{background:linear-gradient(180deg,#43d39a,#1aa56b);color:#fff;border:1px solid rgba(180,255,220,.6)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.btn+.btn{margin-top:10px}
.brow{display:flex;gap:10px;margin-top:10px}.brow .btn{flex:1;margin:0}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;display:flex;padding:6px;border-radius:32px;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:26px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab.on{color:var(--text);background:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
body.light .tab.on{background:rgba(38,114,234,.12);color:#1d5fd6}
.badge{position:absolute;top:2px;right:calc(50% - 24px);font-style:normal;background:#ff4d7d;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nb{font-style:normal;background:#ff4d7d;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px;font-weight:700}
.bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;display:flex;gap:10px;align-items:center;padding:8px;border-radius:34px;z-index:20}
.bbar .btn{flex:1;margin:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--input);border:1px solid var(--border)}
.stepper.sm button{width:34px;height:34px}.stepper.sm svg{width:16px;height:16px}
.stepper b{min-width:24px;text-align:center}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.phead .t{flex:1;text-align:center;font-weight:700;min-width:0}
.phead .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.phead .ph{width:48px}
.hero{position:relative;border-radius:32px;aspect-ratio:1.15;display:grid;place-items:center;margin-bottom:16px;overflow:hidden}
.hero svg.art{width:62%;height:62%}
.box{border-radius:24px;padding:16px}
.desc{color:var(--muted);line-height:1.5;font-size:15px;margin:0}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 6px 8px;display:flex;justify-content:space-between;align-items:center}
.sect .link{text-transform:none;letter-spacing:0;font-size:13px}
.cdot{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:20px;border:1px solid var(--border);background:var(--input);font-weight:600;font-size:14px}
.cdot i{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.55)}
.cdot.on{border-color:#5aa8ff;box-shadow:0 0 0 2px rgba(90,168,255,.5)}
.cdot.na{opacity:.4}
.stock{font-size:13px;color:var(--ok);font-weight:700;margin-top:14px}.stock.out{color:var(--bad)}
.inp{width:100%;height:50px;border-radius:18px;border:1px solid var(--border);background:var(--input);padding:0 16px;outline:0;font-size:15px;-webkit-appearance:none;appearance:none;min-width:0}
.inp.sm{height:42px;border-radius:14px;padding:0 12px;font-size:14px}
textarea.inp{height:90px;padding:14px 16px;resize:none}
.inp:focus{border-color:#5aa8ff}
.inp::placeholder{color:var(--muted)}
select.inp option{color:#0b1736}
.form{border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fl{font-size:12px;color:var(--muted);font-weight:700;margin:2px 6px -4px}
.hint{font-size:12px;color:var(--muted);padding:0 6px;line-height:1.4}
.irow{display:flex;gap:10px;align-items:center}
.irow>*{flex:1}
.irow>.ibtn,.irow>.btn,.irow>.toggle{flex:none}
.seg{display:flex;padding:5px;border-radius:28px;gap:4px}
.seg button{flex:1;height:46px;border-radius:23px;font-weight:700;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:rgba(255,255,255,.17);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
body.light .seg button.on{background:#fff;box-shadow:0 2px 8px rgba(30,70,150,.12)}
.rows{border-radius:24px;padding:12px 16px}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;gap:10px}
.row span{color:var(--muted)}
.row b{text-align:right}
.row.total{font-weight:800;font-size:18px;border-top:1px solid var(--border);margin-top:6px;padding-top:12px}
.row.total span{color:var(--text)}
.green b,.pos{color:var(--ok)}.neg{color:var(--bad)}
.ci{display:flex;gap:12px;border-radius:24px;padding:10px;margin-bottom:10px;align-items:center}
.th{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none;overflow:hidden}
.th.sm{width:52px;height:52px;border-radius:14px}
.th svg{width:80%;height:80%}.th img{width:100%;height:100%;object-fit:cover}
.ci .info{flex:1;min-width:0}
.ci .vl{font-size:12px;color:var(--muted);margin:2px 0 8px}
.ci .bot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.menu{border-radius:24px;overflow:hidden;margin-top:12px}
.mi{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;font-weight:600}
.mi+.mi{border-top:1px solid var(--border)}
.mic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(90,168,255,.18);color:var(--acc);flex:none}
.mic svg{width:19px;height:19px}
.mi-r{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.mi-r svg{width:18px;height:18px}
#sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-wrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:.25s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;border-radius:32px 32px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:linear-gradient(140deg,rgba(32,48,98,.94),rgba(8,14,38,.97));border-top:1px solid var(--border)}
body.light #sheet{background:linear-gradient(140deg,rgba(255,255,255,.97),rgba(234,242,255,.97))}
#sheet-wrap.open{pointer-events:auto}#sheet-wrap.open .backdrop{opacity:1}#sheet-wrap.open #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-head h3{font-size:20px}
.link{color:var(--acc);font-weight:700}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
#sheet .btn.primary{margin-top:20px}
#age{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(2,6,20,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
#age.show{display:grid}
.age-in{max-width:380px;width:100%;border-radius:32px;padding:28px 22px;text-align:center}
.age-in p{color:var(--muted);line-height:1.5;font-size:14px;margin:8px 0 20px}
.age-badge{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 12px 30px rgba(38,114,234,.5)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-180%);z-index:120;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:22px;font-weight:600;font-size:14px;transition:transform .3s;background:rgba(18,30,68,.9);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:translate(-50%,0)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:130;display:none;background:linear-gradient(90deg,transparent,#5aa8ff,transparent);background-size:50% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
.tl{border-radius:24px;padding:16px}
.st{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.st:last-child{padding-bottom:0}
.st .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center;background:var(--input);z-index:1}
.st.done .d{background:#2f86f5;border-color:#7cbcff;color:#fff}
.st .d svg{width:13px;height:13px;stroke-width:3}
.st:not(:last-child)::after{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--border)}
.st.done:not(:last-child)::after{background:#2f86f5}
.st .l{font-weight:600;font-size:15px}.st .l small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.st.cur .l{color:var(--acc)}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;background:rgba(90,168,255,.2);color:var(--acc);white-space:nowrap}
.pill.s0{background:rgba(255,176,32,.2);color:var(--warn)}
.pill.s4,.pill.ok{background:rgba(40,190,120,.2);color:var(--ok)}.pill.sx,.pill.bad{background:rgba(240,60,100,.2);color:var(--bad)}
.pill.mute{background:var(--input);color:var(--muted)}
.oc{border-radius:24px;padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left}
.oc-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:8px}
.oc-m{color:var(--muted);font-size:13px;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.oc-r{margin-top:8px;font-size:13px;color:var(--warn);font-weight:700}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.35;word-wrap:break-word}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.msg .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.msg.op{align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;border-bottom-right-radius:6px}
.msg.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.cin{flex:1;background:none;border:0;outline:0;padding:0 12px;font-size:15px;min-width:0}
.cin::placeholder{color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center;margin:12px 0 14px}
.stars svg{width:38px;height:38px;stroke:#ffc53d}
.stars .on svg{fill:#ffc53d}
.rv{padding:12px 0;border-top:1px solid var(--border)}.rv:first-of-type{border-top:0}
.rv-h{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.rv-s{color:#ffc53d;font-size:13px;letter-spacing:1px}
.rv p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ei{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--acc)}
.empty h3{color:var(--text);margin:0 0 6px}
.pcard{display:flex;align-items:center;gap:14px;border-radius:26px;padding:14px}
.ava{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;overflow:hidden;flex:none}
.ava.sm{width:40px;height:40px;font-size:15px}
.ava img{width:100%;height:100%;object-fit:cover}
.bcard{border-radius:26px;padding:18px;margin-top:12px;background:linear-gradient(140deg,rgba(90,168,255,.5),rgba(38,114,234,.22))!important;color:#fff;display:block;width:100%;text-align:left}
body.light .bcard{background:linear-gradient(140deg,#5aa8ff,#2672ea)!important}
.bcard .big{font-size:38px;font-weight:800;line-height:1.1}
.bcard p{margin:6px 0 0;font-size:13px;opacity:.85;line-height:1.45}
.ref{border-radius:26px;padding:16px;margin-top:12px}
.ref span.d{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
.reflink{display:flex;gap:8px;align-items:center;margin-top:12px}
.reflink code{flex:1;font-size:12px;padding:10px 12px;border-radius:14px;background:var(--input);border:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:16px 6px;line-height:1.4}
.agree input{width:20px;height:20px;accent-color:#2f86f5;flex:none;margin:0}

function tagsHtml(p){
  const t = [];
  if (stock(p) === 0) t.push(['out','Нет в наличии']);
  else { if (p.tags.includes('hit')) t.push(['hit','Хит']); if (p.tags.includes('new')) t.push(['new','Новинка']); if (p.old) t.push(['sale','Скидка']); }
  return `<div class="tags">${t.map(([c,l])=>`<span class="tag ${c}">${l}</span>`).join('')}</div>`;
}
function toast(t){ const el = $('#toast'); el.innerHTML = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 3000); }
function empty(i, h, t, btn=''){ return `<div class="empty"><div class="ei glass">${ic(i)}</div><h3>${h}</h3><div>${t}</div>${btn?`<div style="margin-top:18px">${btn}</div>`:''}</div>`; }
function head(title, sub='', right='<div class="ph"></div>'){ return `<div class="phead"><button class="ibtn glass" onclick="A.back()">${ic('back')}</button><div class="t">${title}${sub?`<small>${sub}</small>`:''}</div>${right}</div>`; }

function addPoints(cid, n, r){ const c = DB.clients[cid]; if (!c || !n) return; c.bonus += n; c.ledger.unshift({ts:Date.now(), n, r}); }
function log(text){ const s = staffBy(S.as); DB.log.unshift({ts:Date.now(), who:s?s.name:'Система', text}); DB.log.length = Math.min(DB.log.length, 400); }
function notify(cid, text){ const c = DB.clients[cid]; toast(`🔔 Бот → ${cid===ME&&S.mode==='shop'?'вам':esc(c?c.name:'клиенту')}: ${esc(text)}`); }

function ensureClient(){
  if (DB.clients[ME]) return;
  const c = DB.clients[ME] = {id:ME, name:U?[U.first_name,U.last_name].filter(Boolean).join(' '):'Гость', phone:'', city:G.cities[0], address:'', joined:Date.now(), refBy:null, refRewarded:false, bonus:0, ledger:[], blocked:false};
  addPoints(ME, G.welcome, 'Приветственные баллы');
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^ref_/.test(sp)) applyRef(sp.slice(4), true);
  save();
}
function applyRef(code, silent){
  const c = me(), no = m => { if (silent) return false; throw new Error(m); };
  if (!G.refOn) return no('Реферальная программа сейчас выключена');
  if (code===ME) return no('Нельзя пригласить самого себя');
  if (!DB.clients[code]) return no('Код не найден');
  if (c.refBy) return no('Код друга уже применён');
  if (myOrders().length) return no('Код действует только до первого заказа');
  c.refBy = code; addPoints(ME, G.refFriend, 'Бонус за приглашение');
  return true;
}
const refLink = id => `https://t.me/${G.bot}?startapp=ref_${id}`;
const invitedBy = id => Object.values(DB.clients).filter(c=>c.refBy===id);

/* ================= ЗАКАЗЫ: ЛОГИКА СТАТУСОВ ================= */
const stName = (o, s=o.status) => s===-1 ? 'Отменён' : (s===3 && o.method==='pickup' ? 'Готов к выдаче' : ST[s]);
const pillCls = o => o.status===4 ? 's4' : o.status===-1 ? 'sx' : o.status===0 ? 's0' : '';
function setStatus(o, s){
  const prev = o.status; o.status = s; const who = staffBy(S.as);
  o.history.push({s, ts:Date.now(), by:S.mode==='admin'&&who?who.name:'Клиент'});
  const c = DB.clients[o.client];
  if (s===-1){
    o.items.forEach(i=>{ const v = V(P(i.pid), i.vid); if (v) v.stock += i.qty; });
    if (o.bonus) addPoints(o.client, o.bonus, `Возврат баллов, заказ №${o.id} отменён`);
    if (o.promo){ const pr = DB.promos.find(x=>x.code===o.promo); if (pr && pr.used) pr.used--; }
  }
  if (s===4){
    o.paid = true; if (o.pay==='cash' && o.courier) o.handed = false;
    addPoints(o.client, o.cashback, `Кэшбэк за заказ №${o.id}`);
    if (c && c.refBy && !c.refRewarded && G.refOn && o.total >= G.refMin){
      c.refRewarded = true; addPoints(c.refBy, G.refInviter, `Друг ${c.name} сделал первый заказ`);
      setTimeout(()=>notify(c.refBy, `ваш друг сделал первый заказ, +${G.refInviter} баллов`), 3200);
    }
  }
  if (s===3 && o.method==='delivery'){ const ch = chatFor(o.id); ch.msgs.push({from:'sys', t:`Курьер ${(staffBy(o.courier)||{name:''}).name} подключился к чату`, ts:Date.now()}); }
  const msg = s===4 ? `заказ №${o.id} выполнен, +${o.cashback} баллов. Оцените товары — ещё +${G.reviewBonus}!` : s===-1 ? `заказ №${o.id} отменён` : `заказ №${o.id} — «${stName(o)}»`;
  notify(o.client, msg);
  if (S.mode==='admin') log(`Заказ №${o.id}: ${stName(o,prev)} → ${stName(o)}`);
  save();
}
function chatFor(id){ const o = DB.orders.find(x=>x.id==id); return DB.chats[id] = DB.chats[id] || {client:o?o.client:ME, order:o?o.id:null, unread:0, msgs:[]}; }

let F = {q:'',cat:'all',brands:[],fg:[],mg:[],min:'',max:'',sort:'pop'};
let PS = null, CO = null, RV = null, ED = null, SE = null, PE = null, BC = null;

function shopProducts(){ return DB.products.filter(p=>!p.hidden); }
function filtered(){
  const q = F.q.trim().toLowerCase();
  const l = shopProducts().filter(p =>
    (F.cat==='all' || p.cat===F.cat) &&
    (!q || [p.name,p.brand,...p.variants.map(v=>v.flavor||'')].join(' ').toLowerCase().includes(q)) &&
    (!F.brands.length || F.brands.includes(p.brand)) &&
    (!F.fg.length || p.variants.some(v=>F.fg.includes(v.fg))) &&
    (!F.mg.length || p.variants.some(v=>F.mg.includes(v.mg))) &&
    (F.min==='' || minPrice(p) >= +F.min) && (F.max==='' || minPrice(p) <= +F.max));
  const sorts = {
    pop:(a,b)=>(b.tags.includes('hit')-a.tags.includes('hit')) || (rating(b.id).n-rating(a.id).n),
    cheap:(a,b)=>minPrice(a)-minPrice(b), exp:(a,b)=>minPrice(b)-minPrice(a),
    new:(a,b)=>b.added-a.added, rate:(a,b)=>(+rating(b.id).avg||0)-(+rating(a.id).avg||0)};
  const out = p => stock(p) > 0 ? 0 : 1;
  return l.sort((a,b)=>out(a)-out(b) || sorts[F.sort](a,b));
}
const filterCount = () => F.brands.length + F.fg.length + F.mg.length + (F.min!==''?1:0) + (F.max!==''?1:0) + (F.sort!=='pop'?1:0);
function card(p){
  const r = rating(p.id), mp = minPrice(p), many = new Set(p.variants.map(v=>vPrice(p,v))).size > 1, out = stock(p)===0;
  return `<div class="card glass" onclick="A.open(${p.id})">
    <div class="pic">${art(p)}${tagsHtml(p)}<button class="fav ${S.fav.includes(p.id)?'on':''}" onclick="event.stopPropagation();A.fav(${p.id})">${ic('heart')}</button></div>
    <div class="cbody"><div class="brand">${esc(p.brand)}</div><div class="pname">${esc(p.name)}</div>
    <div class="rate">${ic('star')} ${r.avg||'—'} <span>(${r.n})</span></div>
    <div class="prow"><div class="price">${p.old?`<s>${p.old} руб.</s>`:''}${many?'от ':''}${mp} <small>руб.</small></div>
    <button class="add" ${out?'disabled':''} onclick="event.stopPropagation();A.quick(${p.id})">${ic('plus')}</button></div></div></div>`;
}
const gridHtml = list => list.length ? `<div class="grid">${list.map(card).join('')}</div>` : empty('search','Ничего не найдено','Измените запрос или сбросьте фильтры');

function vFav(){

const canReview = pid => DB.orders.some(o=>o.client===ME && o.status===4 && o.items.some(i=>i.pid===pid)) && !reviews(pid).some(x=>x.cid===ME);

/* ---------- корзина ---------- */
function cartSub(){ return S.cart.reduce((a,i)=>{ const p=P(i.pid), v=V(p,i.vid); return p&&v ? a + vPrice(p,v)*i.qty : a; }, 0); }
function calc(del=0){
  const sub = cartSub(), pr = S.promo && S.promoData && S.promoData.code===S.promo ? S.promoData : null, prOk = pr && sub >= (pr.min||0);
  const disc = prOk ? (pr.t==='pct' ? Math.round(sub*pr.v/100) : Math.min(pr.v,sub)) : 0;
  const base = sub - disc, bonus = S.useBonus ? Math.max(0, Math.min(me().bonus, Math.floor(base*G.maxBonus/100))) : 0, pay = base - bonus;
  return {sub, disc, bonus, del, total: pay + del, cashback: Math.floor(pay*G.cashback/100), prOk, pr};
}
function vCart(){
  S.cart = S.cart.filter(i=>V(P(i.pid),i.vid));
  if (!S.cart.length) return `<header class="top"><div><h1>Корзина</h1></div></header>` + empty('bag','Корзина пуста','Добавьте товары из каталога',`<button class="btn primary" onclick="A.tab('catalog')">В каталог</button>`);
  const c = calc(), avail = Math.min(me().bonus, Math.floor((c.sub-c.disc)*G.maxBonus/100));
  return `<header class="top"><div><div class="sub">${cartCount()} шт.</div><h1>Корзина</h1></div><button class="link" onclick="A.clearCart()">Очистить</button></header>
  ${S.cart.map((i,idx)=>{ const p=P(i.pid), v=V(p,i.vid); return `<div class="ci glass">
    <div class="th" onclick="A.open(${p.id})">${art(p)}</div>

    <div class="bot"><div class="price">${rub(vPrice(p,v)*i.qty)}</div>
      <div class="stepper sm"><button onclick="A.cq(${idx},-1)">${ic(i.qty>1?'minus':'trash')}</button><b>${i.qty}</b><button onclick="A.cq(${idx},1)">${ic('plus')}</button></div></div></div></div>`; }).join('')}
  <div class="sect">Промокод</div>
  <div class="form glass">${c.pr ? `<div class="applied" ${c.prOk?'':'style="color:var(--warn)"'}><span>${c.prOk?'✓':'!'} ${esc(c.pr.code)} · ${c.pr.t==='pct'?'−'+c.pr.v+'%':'−'+c.pr.v+' руб.'}${c.prOk?'':` (от ${c.pr.min} руб.)`}</span><button class="ibtn sm" onclick="A.promoOff()">${ic('x')}</button></div>`
    : `<div class="irow"><input class="inp" id="promo" placeholder="Введите промокод" style="text-transform:uppercase"><button class="btn primary" style="height:50px" onclick="A.promo()">OK</button></div>`}</div>
  <div class="sect">Баллы</div>
  <div class="form glass"><div class="sw"><div><b>Списать баллы</b><span>Доступно ${me().bonus} · можно до ${Math.max(0,avail)} руб. (${G.maxBonus}% суммы)</span></div>${sw(S.useBonus,'A.useBonus()')}</div></div>
  <div class="sect">Итого</div>
  <div class="rows glass">
    <div class="row"><span>Товары</span><b>${rub(c.sub)}</b></div>
    ${c.disc?`<div class="row green"><span>Промокод</span><b>−${rub(c.disc)}</b></div>`:''}
    ${c.bonus?`<div class="row green"><span>Баллами</span><b>−${rub(c.bonus)}</b></div>`:''}
    <div class="row"><span>Доставка</span><b>при оформлении</b></div>
    <div class="row total"><span>К оплате</span><b>${rub(c.total)}</b></div>
    <div class="row green"><span>Кэшбэк после получения</span><b>+${c.cashback} баллов</b></div>
  </div>
  ${G.minOrder && c.sub < G.minOrder ? `<p class="hint" style="margin-top:10px;color:var(--warn)">Минимальная сумма заказа — ${rub(G.minOrder)}</p>`:''}

}

function timeline(o){
  const steps = o.status===-1 ? [{l:'Новый',done:true,ts:o.ts},{l:'Отменён',done:true,cur:true,ts:(o.history.at(-1)||{}).ts}]
    : ST.map((_,s)=>{ const h = o.history.filter(h=>h.s===s).at(-1); return {l:stName(o,s), done:s<=o.status, cur:s===o.status, ts:h&&h.ts, by:h&&h.by}; });
  return `<div class="tl glass">${steps.map(s=>`<div class="st ${s.done?'done':''} ${s.cur?'cur':''}"><div class="d">${s.done?ic('check'):''}</div><div class="l">${s.l}${s.ts?`<small>${fmt(s.ts)}${S.mode==='admin'&&s.by?' · '+esc(s.by):''}</small>`:''}</div></div>`).join('')}</div>`;
}

/* ---------- обзор (владелец) ---------- */
function perFrom(){ const d = new Date(); d.setHours(0,0,0,0); return {today:d.getTime(), '7':d.getTime()-6*DAY, '30':d.getTime()-29*DAY, all:0}[S.per]; }
function aDash(){
  const from = perFrom(), os = DB.orders.filter(o=>o.ts>=from), done = os.filter(o=>o.status===4);
  const rev = sum(done,o=>o.total), prof = sum(done,oProfit), cnt = done.length, qty = sum(done,o=>sum(o.items,i=>i.qty));
  const newCl = Object.values(DB.clients).filter(c=>c.joined>=from).length;
  const waiting = DB.orders.filter(o=>o.status===0).length, inWork = DB.orders.filter(o=>o.status>=1&&o.status<=3);
  const days = S.per==='today' ? 1 : S.per==='7' ? 7 : 30, d0 = new Date(); d0.setHours(0,0,0,0);
  const bars = Array.from({length:days},(_,i)=>{ const s = d0.getTime()-(days-1-i)*DAY; return {s, v:sum(DB.orders.filter(o=>o.status===4&&o.ts>=s&&o.ts<s+DAY),o=>o.total)}; });
  const mx = Math.max(1,...bars.map(b=>b.v)), bw = 300/days;
  const top = {}; done.forEach(o=>o.items.forEach(i=>{ const t = top[i.pid] = top[i.pid]||{n:i.name,q:0,r:0}; t.q+=i.qty; t.r+=i.price*i.qty; }));
  const topL = Object.values(top).sort((a,b)=>b.r-a.r).slice(0,5), tmx = Math.max(1,...topL.map(t=>t.r));
  const bycat = {}; done.forEach(o=>o.items.forEach(i=>{ const p = P(i.pid); const k = p?catName(p.cat):'—'; bycat[k]=(bycat[k]||0)+i.price*i.qty; }));
  const catL = Object.entries(bycat).sort((a,b)=>b[1]-a[1]), cmx = Math.max(1,...catL.map(c=>c[1]));
  const cashS = sum(done.filter(o=>o.pay==='cash'),o=>o.total), cardS = rev - cashS;
  const onHands = sum(DB.staff.filter(s=>s.role==='courier'),s=>sum(courierCash(s.id),o=>o.total));
  const led = Object.values(DB.clients).flatMap(c=>c.ledger.filter(l=>l.ts>=from));
  const given = sum(led.filter(l=>l.n>0),l=>l.n), spent = -sum(led.filter(l=>l.n<0&&/^Оплата/.test(l.r)),l=>l.n);
  const low = lowList();
  const tile = (k,v,s='',cls='') => `<div class="tile glass ${cls}"><div class="k">${k}</div><div class="v cnum">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  return aTop('Обзор', esc(G.name)+' · владелец', `<button class="ibtn glass" onclick="A.export()">${ic('download')}</button>`) +
  `<div class="chips">${[['today','Сегодня'],['7','7 дней'],['30','30 дней'],['all','Всё время']].map(([k,l])=>`<button class="chip ${S.per===k?'on':''}" onclick="A.per('${k}')">${l}</button>`).join('')}</div>
  ${waiting?`<button class="li glass" onclick="A.aof('new');A.atab('orders')"><span class="mic" style="background:rgba(255,176,32,.2);color:var(--warn)">${ic('box')}</span><div class="m"><b>Новых заказов: ${waiting}</b><span>Ожидают подтверждения</span></div>${ic('chev')}</button>`:''}
  <div class="tiles">
    ${tile('Выручка', rub(rev), 'выполненные заказы')}${tile('Прибыль', rub(prof), rev?Math.round(prof/Math.max(1,rev-sum(done,o=>o.del))*100)+'% маржа':'')}
    ${tile('Заказов', cnt, 'в работе: '+inWork.length)}${tile('Средний чек', rub(cnt?rev/cnt:0))}
    ${tile('Продано, шт.', qty)}${tile('Новых клиентов', newCl, 'всего: '+Object.keys(DB.clients).length)}
  </div>
  <div class="sect">Выручка по дням</div>
  <div class="chart glass"><svg viewBox="0 0 300 140" preserveAspectRatio="none">
    ${bars.map((b,i)=>{ const h = Math.max(b.v?3:0, b.v/mx*112); return `<rect x="${i*bw+bw*.15}" y="${120-h}" width="${bw*.7}" height="${h}" rx="${Math.min(4,bw*.3)}" fill="url(#bg1)"><title>${fmtDay(b.s)}: ${rub(b.v)}</title></rect>`; }).join('')}
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa8ff"/><stop offset="1" stop-color="#2672ea"/></linearGradient></defs>
    <line x1="0" y1="120.5" x2="300" y2="120.5" stroke="currentColor" opacity=".15"/>
    <text x="0" y="136" font-size="9" fill="currentColor" opacity=".55">${fmtDay(bars[0].s).slice(0,5)}</text><text x="300" y="136" font-size="9" text-anchor="end" fill="currentColor" opacity=".55">${fmtDay(bars.at(-1).s).slice(0,5)}</text>
    <text x="300" y="10" font-size="9" text-anchor="end" fill="currentColor" opacity=".55">макс ${rub(mx)}</text></svg></div>
  <div class="sect">Топ товаров</div>
  <div class="box glass">${topL.length?topL.map(t=>`<div class="bar-row"><span class="n">${esc(t.n)} <small style="color:var(--muted)">×${t.q}</small></span><span class="b"><i style="width:${t.r/tmx*100}%"></i></span><span class="v">${rub(t.r)}</span></div>`).join(''):'<p class="desc">Нет продаж за период</p>'}</div>
  <div class="sect">По категориям</div>
  <div class="box glass">${catL.length?catL.map(([k,v])=>`<div class="bar-row"><span class="n">${esc(k)}</span><span class="b"><i style="width:${v/cmx*100}%"></i></span><span class="v">${rub(v)}</span></div>`).join(''):'<p class="desc">Нет данных</p>'}</div>
  <div class="sect">Деньги и баллы</div>
  <div class="tiles">
    ${tile('Наличными', rub(cashS))}${tile('Переводом', rub(cardS))}
    ${tile('У курьеров на руках', rub(onHands), '<a onclick="A.go(\'staff\')">принять кассу ›</a>')}${tile('Баллы', '+'+given+' / −'+spent, 'начислено / списано')}
  </div>
  <div class="sect">Склад <button class="link" onclick="A.go('low')">Все ›</button></div>
  ${low.length?`<button class="li glass" onclick="A.go('low')"><span class="mic" style="background:rgba(240,60,100,.18);color:var(--bad)">${ic('alert')}</span><div class="m"><b>Заканчиваются: ${low.length} поз.</b><span>${esc(low.slice(0,3).map(x=>x.p.name+(vLabel(x.v)?' ('+vLabel(x.v)+')':'')).join(', '))}</span></div>${ic('chev')}</button>`:'<div class="box glass"><p class="desc">Все остатки в норме</p></div>'}`;
}

/* ---------- курьер ---------- */
function aDeliv(){
  const my = DB.orders.filter(o=>o.courier===S.as && (o.status===2||o.status===3)).sort((a,b)=>a.ts-b.ts);
  const free = DB.orders.filter(o=>o.method==='delivery' && o.status===2 && !o.courier);
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const today = DB.orders.filter(o=>o.courier===S.as && o.status===4 && (o.history.at(-1)||{}).ts>=d0.getTime());
  const card = o => `<button class="oc glass" onclick="A.aOrder(${o.id})"><div class="oc-h"><span>№${o.id} · ${esc(o.time)}</span><span class="pill ${pillCls(o)}">${stName(o)}</span></div>
    <div class="oc-m" style="color:var(--text);font-size:14px"><span>📍 ${esc(o.city+', '+o.address)}</span></div>
    <div class="oc-m"><span>${esc(o.name)} · ${o.pay==='cash'?'💵 наличные':'💳 перевод'}${o.paid?' (оплачено)':''}</span><b style="color:var(--text)">${rub(o.total)}</b></div></button>`;
  return aTop('Доставки', 'Курьер · '+esc(cur().name)) +
  `<div class="tiles"><div class="tile glass"><div class="k">Мои активные</div><div class="v">${my.length}</div></div><div class="tile glass"><div class="k">Доставлено сегодня</div><div class="v">${today.length}</div></div></div>
  <div class="sect">Мои заказы</div>${my.length?my.map(card).join(''):'<div class="box glass"><p class="desc">Нет активных доставок</p></div>'}
  <div class="sect">Свободные заказы</div>${free.length?free.map(card).join(''):'<div class="box glass"><p class="desc">Свободных заказов нет</p></div>'}`;
}
function aCash(){
  const l = courierCash(S.as), t = sum(l,o=>o.total);
  return aTop('Касса', 'Курьер · '+esc(cur().name)) +
  `<div class="bcard glass" style="margin-top:0"><div style="font-weight:700;opacity:.9">Наличные на руках</div><div class="big">${rub(t)}</div><p>Сдайте сумму владельцу — он отметит приём в разделе «Сотрудники»</p></div>
  <div class="sect">Заказы (${l.length})</div>
  ${l.length?l.map(o=>`<div class="li glass"><div class="m"><b>№${o.id} · ${esc(o.name)}</b><span>${fmt((o.history.at(-1)||{}).ts||o.ts)} · ${esc(o.city)}</span></div><div class="r">${rub(o.total)}</div></div>`).join(''):'<div class="box glass"><p class="desc">Всё сдано</p></div>'}`;
}

/* ---------- товары ---------- */
function aGoods(){
  const q = S.agq.trim().toLowerCase();
  const list = DB.products.filter(p=>(S.agc==='all'||p.cat===S.agc) && (!q || (p.name+' '+p.brand).toLowerCase().includes(q))).sort((a,b)=>b.added-a.added);
  return aTop('Товары', `${DB.products.length} товаров · ${DB.cats.length} категорий`, `<button class="ibtn primary" onclick="A.edit()">${ic('plus')}</button>`) +
  `<div class="srow"><label class="search glass">${ic('search')}<input placeholder="Название или бренд" value="${esc(S.agq)}" oninput="A.agq(this.value)"></label>${isOwner()?`<button class="fbtn glass" onclick="A.cats()">${ic('grid')}<span>Категории</span></button>`:''}</div>
  <div class="chips">${[{id:'all',name:'Все'},...DB.cats].map(c=>`<button class="chip ${S.agc===c.id?'on':''}" onclick="A.agc('${c.id}')">${esc(c.name)}</button>`).join('')}</div>
  <div id="glist">${goodsList(list)}</div>`;
}
function goodsList(list){
  return list.length ? list.map(p=>{ const s = stock(p), low = p.variants.some(v=>(+v.stock||0)<=G.lowStock);
    return `<button class="li glass" onclick="A.edit(${p.id})"><div class="th sm">${art(p)}</div><div class="m"><b>${esc(p.name)}</b><span>${esc(p.brand)} · ${esc(catName(p.cat))} · вариантов: ${p.variants.length}${p.hidden?' · скрыт':''}</span></div>
    <div class="r">${minPrice(p)} руб.<small class="${s===0?'neg':low?'':''}" style="${low?'color:var(--warn)':''}">${s} шт.</small></div></button>`; }).join('')
    : empty('tag','Ничего не найдено','');
}
function newVariant(){ return {id:'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), flavor:'', fg:'', mg:null, ml:null, color:'', hex:'#888888', price:null, cost:null, stock:0}; }

      <div><div class="fl" style="margin-bottom:6px">Категория</div><select class="inp" onchange="ED.cat=this.value">${cats.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="fl">Описание</div><textarea class="inp" oninput="ED.desc=this.value">${esc(p.desc)}</textarea>
    <div class="two"><div><div class="fl" style="margin-bottom:6px">Цена, руб.</div><input class="inp" type="number" inputmode="decimal" value="${p.price??''}" oninput="ED.price=num(this.value)"></div>
      <div><div class="fl" style="margin-bottom:6px">Старая цена (скидка)</div><input class="inp" type="number" inputmode="decimal" value="${p.old??''}" placeholder="—" oninput="ED.old=num(this.value)"></div></div>
  </div>

    <div class="vgrid">
      ${vf(i,'flavor','Вкус','text','w2')}
      <label>Группа вкуса<select class="inp sm" onchange="ED.variants[${i}].fg=this.value"><option value="">—</option>${FG.map(f=>`<option ${v.fg===f?'selected':''}>${f}</option>`).join('')}</select></label>

function aLow(){

/* ---------- клиенты ---------- */
function clientStats(id){ const os = DB.orders.filter(o=>o.client===id), done = os.filter(o=>o.status===4); return {n:os.length, spent:sum(done,o=>o.total), last:Math.max(0,...os.map(o=>o.ts))}; }
function aClients(){
  const q = S.acq.trim().toLowerCase();
  const list = Object.values(DB.clients).filter(c=>!q || (c.name||'').toLowerCase().includes(q) || (c.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§')).map(c=>({c, s:clientStats(c.id)})).sort((a,b)=>b.s.spent-a.s.spent);
  return aTop('Клиенты', `${Object.keys(DB.clients).length} клиентов`) +
  `<div class="srow"><label class="search glass">${ic('search')}<input placeholder="Имя или телефон" value="${esc(S.acq)}" oninput="A.acq(this.value)"></label></div>
  <div id="clist">${list.map(({c,s})=>`<button class="li glass" onclick="A.aClient('${c.id}')"><div class="ava sm">${esc((c.name||'?')[0])}</div><div class="m"><b>${esc(c.name||'Без имени')}${c.blocked?' 🚫':''}</b><span>${esc(c.phone||'нет телефона')} · заказов: ${s.n} · баллы: ${c.bonus}</span></div><div class="r">${rub(s.spent)}</div></button>`).join('')}</div>`;
}
function aClientPage({id}){
  const c = DB.clients[id]; if (!c) return head('Клиент');
  const s = clientStats(id), os = DB.orders.filter(o=>o.client===id).sort((a,b)=>b.ts-a.ts), inv = invitedBy(id), ref = DB.clients[c.refBy];
  return head(esc(c.name||'Клиент'), 'с '+fmtDay(c.joined)) +
  `<div class="tiles"><div class="tile glass"><div class="k">Потратил</div><div class="v">${rub(s.spent)}</div></div><div class="tile glass"><div class="k">Заказов</div><div class="v">${s.n}</div></div>
   <div class="tile glass"><div class="k">Баллы</div><div class="v">${c.bonus}</div></div><div class="tile glass"><div class="k">Пригласил</div><div class="v">${inv.length}</div></div></div>
  <div class="box glass" style="margin-top:12px">
    <div class="info-row">${ic('phone')}<span class="x">${c.phone?`<a href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">${esc(c.phone)}</a>`:'—'}</span></div>
    <div class="info-row">${ic('pin')}<span class="x">${esc([c.city,c.address].filter(Boolean).join(', ')||'—')}</span></div>
    <div class="info-row">${ic('users')}<span class="x">${ref?`Пришёл по приглашению: <a onclick="A.aClient('${ref.id}')">${esc(ref.name)}</a> · ${c.refRewarded?'награда выдана':'ждём первый заказ'}`:'Пришёл сам'}</span></div>
    <div class="info-row">${ic('user')}<span class="x">Telegram ID: ${esc(c.id)}</span></div>
  </div>
  ${isOwner()?`<div class="sect">Начислить / списать баллы</div><div class="form glass"><div class="two"><input class="inp" id="pts" type="number" inputmode="numeric" placeholder="+20 или -20"><input class="inp" id="ptsr" placeholder="Причина"></div><button class="btn primary sm" onclick="A.adjPts('${c.id}')">Применить</button></div>
  <div class="form glass" style="margin-top:10px"><div class="sw"><div><b>Заблокировать</b><span>Не сможет оформлять заказы</span></div>${sw(c.blocked,`A.block('${c.id}')`)}</div></div>`:''}
  <div class="sect">Заказы</div>${os.length?os.map(orderLi).join(''):'<div class="box glass"><p class="desc">Заказов нет</p></div>'}
  ${inv.length?`<div class="sect">Приглашённые</div>${inv.map(x=>`<button class="li glass" onclick="A.aClient('${x.id}')"><div class="ava sm">${esc(x.name[0])}</div><div class="m"><b>${esc(x.name)}</b><span>с ${fmtDay(x.joined)}</span></div><span class="pill ${x.refRewarded?'ok':'mute'}">${x.refRewarded?'купил':'ждём'}</span></button>`).join('')}`:''}
  <div class="sect">История баллов</div><div class="box glass">${c.ledger.slice(0,30).map(l=>`<div class="logrow" style="display:flex;justify-content:space-between;gap:10px"><div>${esc(l.r)}<small>${fmt(l.ts)}</small></div><b class="${l.n>0?'pos':'neg'}">${l.n>0?'+':''}${l.n}</b></div>`).join('')||'<p class="desc">Пусто</p>'}</div>`;
}

async function act(name, data={}, opt={}){
  if (!LIVE){
    try{ const r = LOCAL[name](data); save(); if (!opt.noRender) render(); return r; }
    catch(e){ if (!opt.quiet) toast(esc(e.message)); throw e; }
  }
  if (!opt.silent) busy(true);
  try{
    const resp = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json', apikey:SUPA_KEY}, body:JSON.stringify({initData:tg.initData, action:name, data})});
    const j = await resp.json().catch(()=>({ok:false, error:'Сервер недоступен'}));
    if (!j.ok) throw new Error(j.error || 'Ошибка');
    applyState(j.state); if (!opt.noRender) render();
    return j.res;
  }catch(e){ if (!opt.quiet) toast(esc(/fetch|network|load failed/i.test(e.message) ? 'Нет связи с сервером' : e.message)); throw e; }
  finally{ if (!opt.silent) busy(false); }
}

/* ---------- демо-реализация тех же действий (без сервера) ---------- */
const LOCAL = {
  boot(){ return null; },
  writeOk(){ return null; },
  profile(d){ Object.assign(me(), {name:d.name, phone:d.phone, city:d.city, address:d.address}); },
  refCode(d){ applyRef(String(d.code||'').replace(/^ref_/,''), false); },
  promo(d){ const p = DB.promos.find(x=>x.code===d.code); if (!p || !p.active || (p.limit && p.used>=p.limit)) fail('Промокод не найден или закончился'); return {...p}; },
  place(d){
    if (me().blocked) fail('Оформление недоступно, свяжитесь с поддержкой');
    const items = d.items.map(i=>{ const p = DB.products.find(x=>x.variants.some(v=>v.id===i.vid)), v = p && V(p,i.vid);
      if (!v || p.hidden) fail('Товар больше недоступен — обновите корзину');
      if (v.stock < i.qty) fail('Закончился товар: '+p.name+'. Обновите корзину');
      return {pid:p.id, vid:v.id, name:p.name, label:vLabel(v)||p.brand, price:vPrice(p,v), cost:v.cost||0, qty:i.qty}; });
    const sub = items.reduce((a,i)=>a+i.price*i.qty,0);
    if (G.minOrder && sub < G.minOrder) fail(`Минимальная сумма заказа — ${rub(G.minOrder)}`);
    const pr = d.promo && DB.promos.find(x=>x.code===d.promo && x.active && (!x.limit || x.used<x.limit) && sub >= (x.min||0));
    const disc = pr ? (pr.t==='pct' ? Math.round(sub*pr.v/100) : Math.min(pr.v,sub)) : 0, base = sub - disc;
    const bonus = d.useBonus ? Math.max(0, Math.min(me().bonus, Math.floor(base*G.maxBonus/100))) : 0, pay = base - bonus;
    const method = G.pickupOn && d.method==='pickup' ? 'pickup' : 'delivery';
    const city = method==='delivery' ? d.city : G.freeCity, del = method==='delivery' && city!==G.freeCity ? +G.deliveryOther : 0;
    const id = ++DB.seq;
    items.forEach(i=>{ V(P(i.pid), i.vid).stock -= i.qty; });
    DB.orders.push({id, ts:Date.now(), client:ME, name:d.name, phone:d.phone, items, sub, disc, promo:pr?pr.code:null, bonus, del, total:pay+del, cashback:Math.floor(pay*G.cashback/100),
      method, city, address:method==='delivery'?d.address:'', time:d.time, pay:d.pay, comment:d.comment, status:0, history:[{s:0,ts:Date.now(),by:'Клиент'}], courier:null, paid:false, handed:true, note:''});
    if (bonus) addPoints(ME, -bonus, `Оплата заказа №${id}`);
    if (pr) pr.used++;
    Object.assign(me(), {name:d.name, phone:d.phone, city, address:d.address || me().address});
    DB.chats[id] = {client:ME, order:id, unread:0, msgs:[{from:'op', t:`Здравствуйте! Заказ №${id} получен, скоро подтвердим.`, ts:Date.now()}]};
    return {id};
  },
  cancelMy(d){ const o = ord(d.id); if (o.status>1) fail('Заказ уже собирается — напишите оператору'); setStatus(o, -1); },
  review(d){ if (!canReview(d.pid)) fail('Отзыв можно оставить после получения товара'); (DB.reviews[d.pid] = DB.reviews[d.pid]||[]).unshift({n:me().name||'Покупатель', cid:ME, r:d.r, t:d.t, ts:Date.now()}); if (G.reviewBonus) addPoints(ME, G.reviewBonus, 'Бонус за отзыв'); },
  chatSend(d){
    const ch = DB.chats[d.key] || chatFor(d.key), admin = S.mode==='admin' && cur();
    const from = admin ? (role()==='courier' ? 'courier' : 'op') : 'client';
    const first = !ch.msgs.some(m=>m.from==='client');
    ch.msgs.push({from, t:d.t, ts:Date.now()});
    if (admin){ ch.unread = 0; notify(ch.client, `новое сообщение${ch.order?' по заказу №'+ch.order:''}`); }
    else { ch.unread = (ch.unread||0) + 1; if (first && !ch.order) ch.msgs.push({from:'sys', t:'Сообщение доставлено. Оператор ответит в рабочее время.', ts:Date.now()}); }
  },
  chatRead(d){ const ch = DB.chats[d.key]; if (ch) ch.unread = 0; },
  status(d){ const o = ord(d.id); if (o.status===-1 || o.status===4) fail('Заказ уже закрыт'); if (d.s!==-1 && d.s!==o.status+1) fail('Статус уже изменился — обновите экран'); if (d.s===3 && o.method==='delivery' && !o.courier) fail('Сначала назначьте курьера'); setStatus(o, d.s); },
  take(d){ const o = ord(d.id); if (o.courier) fail('Заказ уже взял другой курьер'); o.courier = S.as; log(`Курьер взял заказ №${o.id}`); },
  courier(d){ const o = ord(d.id); o.courier = d.cid || null; log(`Заказ №${o.id}: курьер — ${(staffBy(d.cid)||{name:'не назначен'}).name}`); },
  paid(d){ ord(d.id).paid = true; log(`Заказ №${d.id}: оплата получена`); },
  note(d){ ord(d.id).note = d.t; },
  product(d){
    const p = JSON.parse(JSON.stringify(d.p));
    p.variants.forEach(v=>{ ['flavor','color'].forEach(k=>{ v[k] = (v[k]||'').trim() || undefined; }); if (!v.flavor) delete v.fg; v.stock = Math.max(0, Math.round(+v.stock||0)); if (!v.color) delete v.hex; ['mg','ml','price'].forEach(k=>{ if (v[k]==null) delete v[k]; }); });
    const sig = v => ATTRS.map(([k])=>v[k]??'').join('|');
    if (new Set(p.variants.map(sig)).size !== p.variants.length) fail('Есть одинаковые варианты — различите их вкусом, крепостью, объёмом или цветом');
    p.name = p.name.trim(); p.brand = (p.brand||'').trim() || '—';
    if (!p.id){ p.id = Math.max(0,...DB.products.map(x=>x.id))+1; p.added = Date.now(); DB.products.push(p); log(`Добавлен товар «${p.name}»`); }
    else { if (!isOwner()){ const old = P(p.id); p.variants.forEach(v=>{ const ov = old.variants.find(x=>x.id===v.id); v.cost = ov ? ov.cost : null; }); }
      DB.products[DB.products.findIndex(x=>x.id===p.id)] = p; log(`Изменён товар «${p.name}»`); }
    return {id:p.id};
  },
  productDel(d){ const p = P(d.id); DB.products = DB.products.filter(x=>x.id!==d.id); if (p) log(`Удалён товар «${p.name}»`); },
  upload(d){ return {url:d.data}; },
  catAdd(d){ DB.cats.push({id:'c'+Date.now().toString(36), name:d.name}); log(`Добавлена категория «${d.name}»`); },
  catRen(d){ const c = DB.cats.find(x=>x.id===d.id); log(`Категория «${c.name}» → «${d.name}»`); c.name = d.name; },
  catDel(d){ if (DB.products.some(p=>p.cat===d.id)) fail('В категории есть товары'); DB.cats = DB.cats.filter(c=>c.id!==d.id); log('Удалена категория'); },
  points(d){ const c = DB.clients[d.cid]; if (c.bonus + d.n < 0) fail('Недостаточно баллов'); addPoints(d.cid, d.n, d.r); log(`${c.name}: ${d.n>0?'+':''}${d.n} баллов (${d.r})`); notify(d.cid, `${d.n>0?'начислено':'списано'} ${Math.abs(d.n)} баллов: ${d.r}`); },
  block(d){ const c = DB.clients[d.cid]; c.blocked = !c.blocked; log(`${c.name}: ${c.blocked?'заблокирован':'разблокирован'}`); },
  promoAdd(d){ if (DB.promos.some(p=>p.code===d.code)) fail('Такой код уже есть'); DB.promos.unshift({code:d.code, t:d.t, v:d.v, min:d.min||0, limit:d.limit||0, used:0, active:true}); log(`Создан промокод ${d.code}`); },
  promoTog(d){ const p = DB.promos.find(x=>x.code===d.code); p.active = !p.active; log(`Промокод ${p.code} ${p.active?'включён':'выключен'}`); },
  promoDel(d){ DB.promos = DB.promos.filter(x=>x.code!==d.code); log(`Удалён промокод ${d.code}`); },
  bcast(d){ const a = AUD.find(x=>x[0]===d.aud), list = Object.values(DB.clients).filter(c=>!c.blocked).filter(a[2]); if (!list.length) fail('Нет получателей'); DB.broadcasts.unshift({ts:Date.now(), t:d.t, aud:a[1], n:list.length}); log(`Рассылка «${a[1]}»: ${list.length} получ.`); return {ok:list.length, total:list.length}; },
  staffAdd(d){ if (DB.staff.some(s=>s.id===d.id)) fail('Уже в команде'); DB.staff.push({id:d.id, name:d.name, role:d.role}); log(`Добавлен сотрудник ${d.name} (${ROLES[d.role]})`); },
  staffRole(d){ const s = staffBy(d.id); log(`${s.name}: роль ${ROLES[s.role]} → ${ROLES[d.role]}`); s.role = d.role; },
  staffDel(d){ const s = staffBy(d.id); DB.staff = DB.staff.filter(x=>x.id!==d.id); log(`Удалён сотрудник ${s.name}`); },
  handover(d){ const l = courierCash(d.cid), t = sum(l,o=>o.total); l.forEach(o=>o.handed = true); log(`Принята касса у ${staffBy(d.cid).name}: ${rub(t)}`); return {total:t}; },
  settings(d){ Object.assign(G, JSON.parse(JSON.stringify(d.data))); log(`Изменены настройки: ${d.what||'магазин'}`); },
  setupBot(){ fail('Подключение бота работает только внутри Telegram'); },
  sendFile(){ fail('Недоступно в демо'); }
};

const A = {
  r: render, go, rSheet(){ if (SH) $('#sheet').innerHTML = SH(); },
  closeSheet(){ $('#sheet-wrap').classList.remove('open'); SH = null; },
  back(){ stack.pop(); render(); },
  tab(t){ tab = t; stack = []; render(); window.scrollTo(0,0); },

  theme(){ A.setTheme(S.theme==='dark'?'light':'dark'); },

  q(v){ F.q = v; $('#grid').innerHTML = gridHtml(filtered()); },
  cat(c){ F.cat = c; render(); },

  fReset(){ F = {...F, brands:[], fg:[], mg:[], min:'', max:'', sort:'pop'}; A.rSheet(); },
  fav(id){ const i = S.fav.indexOf(id); i<0 ? S.fav.push(id) : S.fav.splice(i,1); save(); haptic(); render(); },
  open(id){ const p = P(id); if (!p) return toast('Товар недоступен'); const v = p.variants.find(x=>x.stock>0) || p.variants[0]; PS = {id, sel:selOf(v), qty:1}; go('product'); },
  quick(id){ const p = P(id); if (p.variants.length===1) addToCart(id, p.variants[0].id, 1) && render(); else A.open(id); },
  sel(a, i){
    const p = P(PS.id), val = attrVals(p,a)[i]; PS.sel[a] = val;
    if (!p.variants.some(x=>ATTRS.every(([k])=>x[k]==null||x[k]===PS.sel[k]))){ const v = p.variants.find(x=>x[a]===val && x.stock>0) || p.variants.find(x=>x[a]===val); PS.sel = selOf(v); }
    PS.qty = 1; haptic(); render();
  },
  pq(d){ const v = curV(); PS.qty = Math.max(1, Math.min(Math.max(1,v.stock), PS.qty + d)); render(); },
  addCur(){ if (addToCart(PS.id, curV().id, PS.qty)){ PS.qty = 1; render(); } },
  cq(idx, d){ const i = S.cart[idx], v = V(P(i.pid), i.vid); if (d>0 && i.qty>=v.stock){ toast('Больше нет в наличии'); return; } i.qty += d; if (i.qty<=0) S.cart.splice(idx,1); save(); render(); },
  clearCart(){ S.cart = []; S.promo = null; S.promoData = null; save(); render(); },
  async promo(){
    const c = ($('#promo').value||'').trim().toUpperCase(); if (!c) return;
    try{ const p = await act('promo', {code:c}, {noRender:true}); S.promo = p.code; S.promoData = p; save(); render(); toast(cartSub() >= (p.min||0) ? 'Промокод применён' : `Промокод действует от ${p.min} руб.`); }catch(e){}
  },
  promoOff(){ S.promo = null; S.promoData = null; save(); render(); },
  useBonus(){ S.useBonus = !S.useBonus; save(); render(); },
  checkout(){ const p = me(); if (p.blocked) return toast('Оформление недоступно, свяжитесь с поддержкой'); if (G.minOrder && cartSub() < G.minOrder) return toast(`Минимальная сумма заказа — ${rub(G.minOrder)}`);
    CO = {name:p.name==='Гость'?'':p.name, phone:p.phone, method:'delivery', city:G.cities.includes(p.city)?p.city:G.cities[0], address:p.address, time:G.slots[0], pay:'cash', comment:'', agree:false}; go('checkout'); },
  co(k, v){ CO[k] = v; render(); },
  slot(i){ CO.time = G.slots[i]; render(); },
  share(){
    if (tg && tg.requestContact){ try{ tg.requestContact((ok, res)=>{ const ph = res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number; if (ok && ph){ CO.phone = '+'+String(ph).replace(/^\+/,''); render(); } else if (ok) toast('Номер отправлен боту'); }); return; }catch(e){} }
    toast('Работает внутри Telegram');
  },
  async place(){
    if (!CO.name.trim()) return toast('Укажите имя');
    if (CO.phone.replace(/\D/g,'').length < 6) return toast('Укажите телефон');
    if (CO.method==='delivery' && !CO.address.trim()) return toast('Укажите адрес');
    if (!CO.agree) return toast('Подтвердите возраст 18+');
    for (const i of S.cart){ const v = V(P(i.pid), i.vid); if (!v || v.stock < i.qty) return toast('Часть товаров закончилась — проверьте корзину'); }
    const c = calc(delCost());
    try{
      const r = await act('place', {items:S.cart.map(i=>({vid:i.vid, qty:i.qty})), promo:c.prOk?S.promo:null, useBonus:S.useBonus, name:CO.name.trim(), phone:CO.phone.trim(),
        method:G.pickupOn?CO.method:'delivery', city:CO.city, address:CO.address.trim(), time:CO.time, pay:CO.pay, comment:CO.comment.trim()}, {noRender:true});
      S.cart = []; S.promo = null; S.promoData = null; S.useBonus = false; save();
      stack = []; haptic('heavy'); go('success', {id:r.id});
      if (!LIVE) setTimeout(()=>notify(ME, `заказ №${r.id} принят`), 400);
    }catch(e){ render(); }
  },
  goOrder(id){ stack = stack.filter(s=>s.name!=='success'); if (!stack.length || stack.at(-1).name!=='orders') stack.push({name:'orders'}); go('order', {id}); },
  async cancelMy(id){ if (!confirm('Отменить заказ №'+id+'?')) return; await run('cancelMy', {id}); },
  repeat(id){ const o = DB.orders.find(x=>x.id===id); let n = 0; o.items.forEach(i=>{ const v = V(P(i.pid), i.vid); if (v && v.stock>0){ const ex = S.cart.find(c=>c.vid===i.vid); const q = Math.min(i.qty, v.stock-(ex?ex.qty:0)); if (q>0){ ex ? ex.qty += q : S.cart.push({pid:i.pid, vid:i.vid, qty:q}); n++; } } }); save(); A.tab('cart'); toast(n ? 'Товары добавлены в корзину' : 'Товаров нет в наличии'); },
  chat(key){ key = String(key); if (!DB.chats[key]) DB.chats[key] = {client:ME, order:/^\d+$/.test(key)?+key:null, unread:0, msgs:[]}; go('chat', {key}); scrollEnd(); },
  async send(key){

  async rvSend(){ if (RV.t.trim().length < 3) return toast('Напишите пару слов'); try{ await act('review', {pid:RV.pid, r:RV.r, t:RV.t.trim()}, {noRender:true}); A.closeSheet(); render(); toast(G.reviewBonus?`Спасибо! +${G.reviewBonus} баллов`:'Спасибо за отзыв!'); }catch(e){} },
  async saveData(){ try{ await act('profile', {name:$('#d-name').value.trim(), phone:$('#d-phone').value.trim(), city:$('#d-city').value, address:$('#d-addr').value.trim()}, {noRender:true}); A.back(); toast('Сохранено'); }catch(e){} },
  copyRef(){ const l = refLink(ME); try{ navigator.clipboard.writeText(l).then(()=>toast('Ссылка скопирована'), ()=>toast(esc(l))); }catch(e){ toast(esc(l)); } },
  shareRef(){ const u = 'https://t.me/share/url?url='+encodeURIComponent(refLink(ME))+'&text='+encodeURIComponent(`Держи ${G.refFriend} бонусных баллов на первый заказ в ${G.name} 🎁`); try{ tg.openTelegramLink(u); }catch(e){ window.open(u, '_blank'); } },
  async refCode(){ const v = ($('#refcode').value||'').trim().replace(/^ref_/,''); if (!v) return; try{ await act('refCode', {code:v}); toast(`Код принят! +${G.refFriend} баллов на первый заказ`); }catch(e){} },
  reset(){ if (LIVE) return; try{ localStorage.removeItem(DB_KEY); localStorage.removeItem(UI_KEY); }catch(e){} location.reload(); },

  /* ----- админ ----- */

  aoq(v){ S.aoq = v; const f = AOF.find(x=>x[0]===S.aof)||AOF[0], q = v.trim().toLowerCase(); const list = DB.orders.filter(f[2]).filter(o=>!q || String(o.id).includes(q) || (o.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§') || (o.name||'').toLowerCase().includes(q)).sort((a,b)=>b.ts-a.ts); $('#olist').innerHTML = list.length?list.map(orderLi).join(''):empty('box','Заказов нет',''); },

  async take(id){ try{ await act('take', {id}); toast('Заказ ваш'); }catch(e){} },

  achat(key){ key = String(key); const ch = DB.chats[key]; if (!ch) return toast('Чат не найден'); go('achat', {key}); scrollEnd(); if (ch.unread){ ch.unread = 0; run('chatRead', {key}, {silent:true, quiet:true, noRender:true}); } },

  edit(id){ const p = id ? P(id) : null; ED = p ? JSON.parse(JSON.stringify(p)) : {id:null, cat:S.agc!=='all'?S.agc:(DB.cats[0]||{}).id, brand:'', name:'', price:null, old:null, hue:Math.floor(Math.random()*360), tags:[], photos:[], hidden:false, desc:'', variants:[newVariant()]}; go('edit'); },

  async delCat(i){ await run('catDel', {id:DB.cats[i].id}); A.rSheet(); },
  async addCat(){ const v = ($('#newcat').value||'').trim(); if (!v) return; await run('catAdd', {name:v}); A.rSheet(); },
  acq(v){ S.acq = v; const q = v.trim().toLowerCase(); const list = Object.values(DB.clients).filter(c=>!q || (c.name||'').toLowerCase().includes(q) || (c.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§')).map(c=>({c, s:clientStats(c.id)})).sort((a,b)=>b.s.spent-a.s.spent); $('#clist').innerHTML = list.map(({c,s})=>`<button class="li glass" onclick="A.aClient('${c.id}')"><div class="ava sm">${esc((c.name||'?')[0])}</div><div class="m"><b>${esc(c.name||'Без имени')}</b><span>${esc(c.phone||'нет телефона')} · заказов: ${s.n} · баллы: ${c.bonus}</span></div><div class="r">${rub(s.spent)}</div></button>`).join(''); },
  aClient(id){ go('aclient', {id}); },
  async adjPts(id){ const n = Math.round(+($('#pts').value||0)), r = ($('#ptsr').value||'').trim() || (n>0?'Начислено администратором':'Списано администратором'); if (!n) return toast('Введите число'); await run('points', {cid:id, n, r}); },
  block(id){ run('block', {cid:id}); },
  promoEdit(){ PE = {code:'', t:'pct', v:null, min:null, limit:null}; openSheet(sheetPromo); },
  async promoSave(){ if (!PE.code) return toast('Введите код'); if (!(PE.v>0)) return toast('Укажите размер скидки'); if (PE.t==='pct' && PE.v>90) return toast('Слишком большой процент');
    try{ await act('promoAdd', {...PE}, {noRender:true}); A.closeSheet(); render(); }catch(e){} },
  promoTog(i){ run('promoTog', {code:DB.promos[i].code}); },
  promoDel(i){ const p = DB.promos[i]; if (!confirm('Удалить промокод '+p.code+'?')) return; run('promoDel', {code:p.code}); },
  async bcSend(){ if (BC.t.trim().length<3) return toast('Напишите текст'); if (!confirm('Отправить рассылку?')) return;
    try{ const r = await act('bcast', {aud:BC.aud, t:BC.t.trim()}, {noRender:true}); BC.t = ''; render(); toast(r && r.total ? `Доставлено ${r.ok} из ${r.total}` : 'Рассылка отправлена'); }catch(e){} },
  staffRole(i, r){ run('staffRole', {id:DB.staff[i].id, role:r}); },
  staffDel(i){ const s = DB.staff[i]; if (!confirm('Убрать доступ у '+s.name+'?')) return; run('staffDel', {id:s.id}); },
  async staffAdd(){ const id = ($('#sf-id').value||'').trim(), name = ($('#sf-name').value||'').trim(), r = $('#sf-role').value;
    if (!/^\d{3,}$/.test(id)) return toast('Telegram ID — только цифры'); if (!name) return toast('Укажите имя');
    try{ await act('staffAdd', {id, name, role:r}); toast('Сотрудник добавлен'); }catch(e){} },
  async handover(cid){ try{ const r = await act('handover', {cid}); toast('Касса принята' + (r && r.total!=null ? ': '+rub(r.total) : '')); }catch(e){} },
  async saveSet(what){
    const n = ['deliveryOther','minOrder','lowStock','cashback','maxBonus','welcome','reviewBonus','refFriend','refInviter','refMin'];
    for (const k of n){ if (SE[k]==null || isNaN(SE[k]) || SE[k]<0) return toast('Проверьте числовые поля'); }
    if (SE.maxBonus>100) return toast('Оплата баллами — не больше 100%');
    if (!SE.cities.length || !SE.slots.length) return toast('Нужен хотя бы один город и интервал');
    if (SE.pickupOn && !(SE.pickup||'').trim()) return toast('Укажите адрес самовывоза');
    if (SE.appUrl && !/^https:\/\//.test(SE.appUrl)) return toast('Ссылка должна начинаться с https://');
    if (!SE.cities.includes(SE.freeCity)) SE.freeCity = SE.cities[0];
    try{ await act('settings', {data:SE, what}, {noRender:true}); SE = JSON.parse(JSON.stringify(G)); render(); toast('Сохранено'); }catch(e){}
  },
  async setupBot(){ try{ const r = await act('setupBot', {}, {noRender:true}); toast(r && r.menu ? 'Бот подключён ✅' : 'Вебхук подключён ✅'); }catch(e){} },
  export(){ doExport(); }
};
/* страницы, которым нужен черновик при открытии */
const _go = go;
go = function(name, params){ if (['settings','loyal','refset'].includes(name)) SE = JSON.parse(JSON.stringify(G)); if (name==='bcast') BC = {aud:'all', t:''}; _go(name, params); };
A.go = go;

/* ---------- запуск ---------- */
function loadHtml(){
  return `<div class="center" style="padding-top:30vh">${LOAD_ERR
    ? `<div class="ei glass" style="width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--bad)">${ic('alert')}</div><h3>Не удалось загрузить магазин</h3><p class="desc" style="margin:8px 0 20px">${esc(LOAD_ERR)}</p><button class="btn primary" style="margin:0 auto" onclick="boot()">Повторить</button>`
    : `<div class="logo" style="width:64px;height:64px;border-radius:22px;margin:0 auto 16px"><svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px">${IC.cloud}</svg></div><p class="desc">Загрузка…</p>`}</div>`;
}
async function boot(){
  LOAD_ERR = ''; render();
  try{ await act('boot', {}, {noRender:true, quiet:true, silent:true}); }
  catch(e){ LOAD_ERR = /fetch|network|load failed/i.test(e.message) ? 'Нет связи с сервером. Проверьте интернет.' : e.message; render(); return; }
  render(); deepLink();
}
function deepLink(){
  const qp = new URLSearchParams(location.search), o = qp.get('o'), c = qp.get('c');
  if (o){ const ord_ = DB.orders.find(x=>x.id===+o); if (ord_){ if (cur() && ord_.client!==ME){ S.mode = 'admin'; stack = []; go('aorder', {id:ord_.id}); } else { S.mode = 'shop'; tab = 'profile'; stack = [{name:'orders'}]; go('order', {id:ord_.id}); } } }
  else if (c){ const ch = DB.chats[c]; if (cur() && ch && ch.client!==ME){ S.mode = 'admin'; stack = []; A.achat(c); } else { S.mode = 'shop'; tab = 'profile'; stack = []; A.chat(c); } }
}
function poll(){
  if (document.hidden || BUSY || !DB) return;
  const top = stack[stack.length-1], onChat = top && (top.name==='chat' || top.name==='achat');
  if (Date.now() - lastSync < (onChat ? 5000 : 30000)) return;
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  const safe = !SH && !typing && (!top || ['chat','achat','aorder','order','orders','achats','low','aclient','points','ref'].includes(top.name));
  const y = window.scrollY;
  act('boot', {}, {silent:true, quiet:true, noRender:!safe}).then(()=>{ if (safe){ onChat ? scrollEnd() : window.scrollTo(0, y); } }).catch(()=>{ lastSync = Date.now(); });
}

try{ tg && tg.BackButton.onClick(()=>{ if ($('#sheet-wrap').classList.contains('open')) A.closeSheet(); else if (stack.length) A.back(); }); }catch(e){}
if (LIVE){ S.as = ME; boot(); setInterval(poll, 2500); }
else { ensureClient(); render(); }
</script>
